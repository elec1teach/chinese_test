<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Pronunciation Test Station</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Prompt:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- นำเข้า Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        /* (ใช้ CSS เดิมจากไฟล์ UI ที่คุณออกแบบไว้) */
        :root { --bg1: #040816; --bg2: #0a1025; --cyan: #35d8ff; --blue: #6d7cff; --violet: #b56cff; --green: #1dff95; --red: #ff4d6d; --text: #edf5ff; --muted: #9db2d9; }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 20px; font-family: 'Prompt', sans-serif; color: var(--text); background: radial-gradient(circle at 10% 20%, rgba(53, 216, 255, 0.18), transparent 25%), radial-gradient(circle at 90% 10%, rgba(181, 108, 255, 0.15), transparent 25%), linear-gradient(to bottom, var(--bg1), var(--bg2)); min-height: 100vh; overflow-x: hidden;}
        .glass { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.10); backdrop-filter: blur(18px); box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35); border-radius: 30px; }
        .container { max-width: 1150px; margin: auto; position: relative; z-index: 1; }
        .header { padding: 30px; margin-bottom: 22px; display: flex; justify-content: space-between; align-items: center; }
        .logo-area { display: flex; align-items: center; gap: 18px; }
        .logo { width: 70px; height: 70px; border-radius: 22px; display: flex; align-items: center; justify-content: center; font-family: 'Orbitron', sans-serif; font-size: 30px; font-weight: 900; background: linear-gradient(135deg, var(--cyan), #d8f9ff, var(--violet)); color: #07101f; }
        h1 { margin: 0; font-size: 42px; font-family: 'Orbitron', sans-serif; }
        .live { padding: 12px 20px; border-radius: 999px; background: rgba(29, 255, 149, 0.08); border: 1px solid rgba(29, 255, 149, 0.25); color: #87ffca; font-weight: bold; }
        .login-box input { width: 100%; padding: 18px; border-radius: 18px; border: 1px solid rgba(255, 255, 255, 0.12); background: rgba(7, 12, 30, 0.75); color: white; font-size: 20px; outline: none; margin-bottom: 20px;}
        .top-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat { padding: 18px; text-align: center; }
        .stat-title { font-size: 15px; color: var(--muted); }
        .stat-value { margin-top: 10px; font-size: 34px; font-weight: bold; font-family: 'Orbitron', sans-serif; }
        .main-grid { display: grid; grid-template-columns: 1.3fr 0.8fr; gap: 20px; }
        .sentence-box { padding: 35px; text-align: center; }
        .english-text { margin-top: 25px; font-size: 46px; font-weight: 900; color: var(--cyan); }
        .thai-text { margin-top: 14px; font-size: 24px; color: #b6c6e8; }
        .controls { margin-top: 25px; }
        button { border: none; padding: 18px 35px; border-radius: 18px; cursor: pointer; font-size: 20px; font-weight: bold; width: 100%; background: linear-gradient(135deg, var(--cyan), #d8f9ff, var(--violet)); }
        .result-box { padding: 35px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .score { font-size: 90px; font-weight: 900; font-family: 'Orbitron', sans-serif; color: var(--cyan); }
        .teacher-box { margin-top: 25px; padding: 20px; text-align: center; line-height: 1.9; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header glass">
            <div class="logo-area">
                <div class="logo">AI</div>
                <div>
                    <h1>AI Pronunciation Test Station</h1>
                    <div style="color: var(--muted);">ระบบทดสอบการออกเสียงและจ่ายรางวัลอัตโนมัติ</div>
                </div>
            </div>
            <div class="live" id="machineStatusUI">MACHINE ONLINE</div>
        </div>

        <div class="login-box">
            <input type="text" id="studentName" placeholder="กรอกชื่อผู้เข้าทดสอบ" />
        </div>

        <div class="top-bar">
            <div class="stat glass"><div class="stat-title">SCORE</div><div class="stat-value"><span id="totalScore">0</span></div></div>
            <div class="stat glass"><div class="stat-title">PASS</div><div class="stat-value"><span id="passCount">0</span></div></div>
            <div class="stat glass"><div class="stat-title">FAIL</div><div class="stat-value"><span id="failCount">0</span></div></div>
        </div>

        <div class="main-grid">
            <div class="sentence-box glass">
                <div style="color: #c6d6f4; font-size: 14px;" id="questionNumber">ข้อที่ 1</div>
                <div class="english-text" id="englishText">Hello, world!</div>
                <div class="thai-text" id="thaiText">สวัสดีโลก</div>
                <div class="controls">
                    <button id="startBtn" onclick="startRecognition()">🎤 เริ่มพูด</button>
                </div>
            </div>
            <div class="result-box glass">
                <div class="score" id="score">0%</div>
                <div style="font-size: 24px; font-weight: bold; margin-top: 10px;" id="status">รอเริ่มทดสอบ</div>
                <div style="margin-top: 15px; color: #c0d0ed;" id="heardText">AI พร้อมรับเสียง...</div>
            </div>
        </div>

        <div class="teacher-box glass">
            <div style="font-weight: bold; color: #90dfff;">ผู้พัฒนาโครงการ</div>
            ครูวิทยากร วรรณา<br>แผนกอิเล็กทรอนิกส์<br>วิทยาลัยสารพัดช่างศรีสะเกษ
        </div>
    </div>

    <script>
        // --- 1. ตั้งค่า Admin & Firebase ---
        const SCRIPT_URL = "YOUR_GAS_WEBHOOK_URL"; 
        const PASS_THRESHOLD = 80; // เกณฑ์คะแนนที่ต้องการ (เปอร์เซ็นต์)
        const TOTAL_QUESTIONS = 3; // แอดมินกำหนดจำนวนข้อสอบ

        const firebaseConfig = {
           apiKey: "YOUR_API_KEY",
           authDomain: "YOUR_PROJECT.firebaseapp.com",
           databaseURL: "YOUR_DATABASE_URL",
           projectId: "YOUR_PROJECT"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- 2. ข้อมูลข้อสอบ ---
        const questions = [
            { text: "Listen to me please", th: "กรุณาฟังครูครับ" },
            { text: "How are you today", th: "วันนี้คุณเป็นอย่างไรบ้าง" },
            { text: "I love learning electronics", th: "ฉันชอบเรียนอิเล็กทรอนิกส์" }
        ];

        let currentQuestion = 0;
        let passCount = 0;
        let failCount = 0;
        let recognition;

        window.onload = () => {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.lang = 'en-US'; 
                recognition.onresult = handleResult;
            }
            loadQuestion(0);
            monitorMachine();
        };

        function monitorMachine() {
            db.ref('machine/status').on('value', (snap) => {
                const status = snap.val();
                const ui = document.getElementById("machineStatusUI");
                if(status === 'ready') {
                    ui.innerHTML = "MACHINE READY";
                    ui.style.color = "#1dff95";
                    document.getElementById("startBtn").disabled = false;
                } else {
                    ui.innerHTML = "MACHINE BUSY";
                    ui.style.color = "#ff4d6d";
                }
            });
        }

        function loadQuestion(index) {
            document.getElementById("questionNumber").innerHTML = `ข้อที่ ${index + 1} / ${TOTAL_QUESTIONS}`;
            document.getElementById("englishText").innerHTML = questions[index].text;
            document.getElementById("thaiText").innerHTML = questions[index].th;
        }

        function startRecognition() {
            if (!document.getElementById("studentName").value) return alert("กรุณากรอกชื่อก่อนครับ");
            document.getElementById("status").innerHTML = "🎤 AI กำลังฟัง...";
            recognition.start();
        }

        function handleResult(event) {
            const speechResult = event.results[0][0].transcript;
            const target = questions[currentQuestion].text;
            const score = similarity(target, speechResult);
            
            document.getElementById("heardText").innerHTML = "AI ได้ยิน: " + speechResult;
            document.getElementById("score").innerHTML = score + "%";

            if (score >= 60) passCount++; else failCount++; // 60 คือเกณฑ์รายข้อ
            
            document.getElementById("passCount").innerHTML = passCount;
            document.getElementById("failCount").innerHTML = failCount;

            currentQuestion++;
            if (currentQuestion >= TOTAL_QUESTIONS) {
                evaluateFinalResult();
            } else {
                setTimeout(() => loadQuestion(currentQuestion), 1500);
            }
        }

        function evaluateFinalResult() {
            const finalScore = (passCount / TOTAL_QUESTIONS) * 100;
            document.getElementById("totalScore").innerHTML = finalScore.toFixed(0) + "%";
            
            if (finalScore >= PASS_THRESHOLD) {
                document.getElementById("status").innerHTML = "🎉 ยินดีด้วย! กดเลือกรางวัลที่ตู้ได้เลย";
                // ปลดล็อกเครื่องเพื่อให้ผู้ใช้กดปุ่มที่หน้าตู้
                db.ref('machine').update({ 
                    status: 'unlocked',
                    currentUser: document.getElementById("studentName").value 
                });
            } else {
                document.getElementById("status").innerHTML = "❌ เสียใจด้วย คะแนนไม่ถึงเกณฑ์";
            }
            saveToGAS(finalScore);
        }

        function saveToGAS(score) {
            const formData = new URLSearchParams();
            formData.append("name", document.getElementById("studentName").value);
            formData.append("score", score);
            formData.append("pass", passCount);
            formData.append("fail", failCount);
            fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: formData });
        }

        function similarity(s1, s2) {
            // ฟังก์ชันเปรียบเทียบคำอย่างง่าย
            s1 = s1.toLowerCase().replace(/[^a-z]/g, "");
            s2 = s2.toLowerCase().replace(/[^a-z]/g, "");
            let same = 0;
            const len = Math.max(s1.length, s2.length);
            for (let i = 0; i < Math.min(s1.length, s2.length); i++) {
                if (s1[i] === s2[i]) same++;
            }
            return Math.floor((same / len) * 100);
        }
    </script>
</body>
</html>
